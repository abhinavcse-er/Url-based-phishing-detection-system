name: ML model v4 checks

on:
  push:
    branches:
      - main
      - ml-model-v4-hybrid
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-v4-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile model and API modules
        run: python -m compileall -q server.py train_model.py url_features.py

      - name: Run model v4 regression tests
        run: python -m unittest discover -s tests -v
