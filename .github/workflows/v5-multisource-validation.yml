name: V5 independent multi-source external evaluation

on:
  push:
    branches:
      - ml-model-v5-multisource
    paths:
      - "train_model.py"
      - "train_model_v4.py"
      - "train_model_v5.py"
      - "evaluate_external.py"
      - "evaluate_external_v5.py"
      - "url_features.py"
      - "tests/**"
      - ".github/workflows/v5-multisource-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ML_V5_MAX_PER_SOURCE_CLASS: "10000"
      ML_V5_MAX_VALIDATION_FPR: "0.01"
      ML_V5_MAX_SOURCE_VALIDATION_FPR: "0.02"
      MODEL_DIR: models/v5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile V5 and run regression tests
        run: |
          python -m compileall -q server.py train_model.py train_model_v4.py train_model_v5.py url_features.py evaluate_external.py evaluate_external_v5.py
          python -m unittest discover -s tests -v

      - name: Train V5 from pinned development sources only
        run: python train_model_v5.py

      - name: Download pinned external cohorts and all development corpora
        env:
          DATASET_ROOT: https://raw.githubusercontent.com/aI-area/PhishDetecting/aedc3dd65fd92a187f5c174cd8a93a89588a98f6/dataset
        run: |
          mkdir -p /tmp/phishguard-v5-evaluation
          curl --fail --location --retry 3 "$DATASET_ROOT/PhishFusion.csv" --output /tmp/phishguard-v5-evaluation/PhishFusion.csv
          curl --fail --location --retry 3 "$DATASET_ROOT/ebbu2017.csv" --output /tmp/phishguard-v5-evaluation/ebbu2017.csv
          curl --fail --location --retry 3 "$DATASET_ROOT/phishstorm.csv" --output /tmp/phishguard-v5-evaluation/phishstorm.csv
          curl --fail --location --retry 3 "$DATASET_ROOT/PhishTank.csv" --output /tmp/phishguard-v5-evaluation/PhishTank.csv
          curl --fail --location --retry 3 "$DATASET_ROOT/PhreshPhish/test_url_metadata.csv.gz" --output /tmp/phishguard-v5-evaluation/test_url_metadata.csv.gz

          test "$(git hash-object /tmp/phishguard-v5-evaluation/PhishFusion.csv)" = "b698ebad3a81bf81c3868f60b1d1fefb4f1e2361"
          test "$(git hash-object /tmp/phishguard-v5-evaluation/ebbu2017.csv)" = "7995c4d7b1d74c42c7fa82d2f7fd4a1676f5ad93"
          test "$(git hash-object /tmp/phishguard-v5-evaluation/phishstorm.csv)" = "b62bd184e843c271c3a7683b1e92be922e97bf0a"
          test "$(git hash-object /tmp/phishguard-v5-evaluation/PhishTank.csv)" = "d30029a537bc2e8e20fcb9df63e711389144c5a3"
          echo "ecc1efc3a8207f91b3953546011da5f35bc17907e7ae96ada6beb6635efa6dd7  /tmp/phishguard-v5-evaluation/test_url_metadata.csv.gz" | sha256sum --check --strict
          echo "All pinned source and external CSV checksums passed."

      - name: Evaluate V5 on PhreshPhish (no development URL/domain overlap)
        run: |
          python evaluate_external_v5.py \
            --dataset /tmp/phishguard-v5-evaluation/test_url_metadata.csv.gz \
            --url-column url \
            --label-column source_label \
            --phishing-label phish \
            --benign-label benign \
            --source-training-csv /tmp/phishguard-v5-evaluation/PhishFusion.csv \
            --source-training-csv /tmp/phishguard-v5-evaluation/ebbu2017.csv \
            --source-training-csv /tmp/phishguard-v5-evaluation/phishstorm.csv \
            --model models/v5/url_phishing_model.joblib \
            --minimum-per-class 500 \
            --max-fpr 0.01 \
            --min-recall 0.80 \
            --output v5_phreshphish_external_report.json

      - name: Evaluate V5 on untouched PhishTank external cohort
        run: |
          python evaluate_external_v5.py \
            --dataset /tmp/phishguard-v5-evaluation/PhishTank.csv \
            --url-column url \
            --label-column phishing \
            --phishing-label 1 \
            --benign-label 0 \
            --source-training-csv /tmp/phishguard-v5-evaluation/PhishFusion.csv \
            --source-training-csv /tmp/phishguard-v5-evaluation/ebbu2017.csv \
            --source-training-csv /tmp/phishguard-v5-evaluation/phishstorm.csv \
            --model models/v5/url_phishing_model.joblib \
            --minimum-per-class 500 \
            --max-fpr 0.01 \
            --min-recall 0.80 \
            --output v5_phishtank_external_report.json

      - name: Print release-gate outcomes
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ("v5_phreshphish_external_report.json", "v5_phishtank_external_report.json"):
              path = Path(name)
              if not path.exists():
                  print(name, "NOT GENERATED")
                  continue
              report = json.loads(path.read_text(encoding="utf-8"))
              strict = report.get("strict_external_evaluation", {})
              print(json.dumps({
                  "dataset": report.get("dataset_file"),
                  "strict_rows": strict.get("rows"),
                  "strict_class_counts": strict.get("class_counts"),
                  "strict_metrics": strict.get("metrics"),
                  "release_gate": report.get("release_gate"),
                  "decision": report.get("decision"),
                  "automatic_production_enablement": report.get("automatic_production_enablement"),
              }, indent=2))
          PY

      - name: Upload V5 model diagnostics and both external reports
        if: always() && hashFiles('models/v5/training_metrics.json', 'v5_phreshphish_external_report.json', 'v5_phishtank_external_report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: phishguard-v5-multisource-validation
          path: |
            models/v5/training_metrics.json
            v5_phreshphish_external_report.json
            v5_phishtank_external_report.json
          if-no-files-found: warn
          retention-days: 30

